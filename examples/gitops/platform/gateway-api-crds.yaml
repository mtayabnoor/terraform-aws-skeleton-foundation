# Gateway API CRDs (standard channel), taken directly from the upstream repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.0
    path: config/crd
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      # Never remove CRDs automatically: that would delete every Gateway and route.
      prune: false
      selfHeal: true
    syncOptions:
      # The CRDs are too large for client-side apply.
      - ServerSideApply=true
